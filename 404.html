<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Page Not Found — Ayaan PWD</title>
<meta name="robots" content="noindex"/>
<link rel="stylesheet" href="assets/style.css"/>
<style>
body{background:var(--bg);display:flex;flex-direction:column;min-height:100vh}
.err-shell{flex:1;display:flex;align-items:center;justify-content:center;padding:60px 24px}
.err-box{text-align:center;max-width:480px}
.err-code{font-family:var(--ff-head);font-size:clamp(80px,15vw,140px);font-weight:900;line-height:1;background:linear-gradient(135deg,var(--red),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.err-title{font-family:var(--ff-head);font-size:26px;font-weight:800;color:var(--ink);margin-bottom:12px}
.err-sub{font-size:15px;color:var(--ink-3);line-height:1.75;margin-bottom:32px}
.err-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body>
<div id="nav-ph"></div>
<div class="err-shell">
  <div class="err-box">
    <div class="err-code">404</div>
    <div class="err-title">Page not found</div>
    <p class="err-sub">The page you're looking for doesn't exist or may have been moved. Let's get you back on track.</p>
    <div class="err-btns">
      <a href="index.html" class="btn btn-red btn-lg">🏠 Go Home</a>
      <a href="catalog.html" class="btn btn-blue btn-lg">🛍 Browse Shop</a>
      <a id="err-wa" href="#" target="_blank" class="btn btn-wa btn-lg">💬 WhatsApp Us</a>
    </div>
  </div>
</div>
<div id="footer-ph"></div>
<script src="assets/app.js"></script>
<script>
document.getElementById('nav-ph').innerHTML=buildNav('');
document.getElementById('footer-ph').innerHTML=buildFooter();
document.getElementById('err-wa').href=waLink('Assalam o Alaikum! I got a 404 error on your website. Can you help?');
</script>
</body>
</html>
