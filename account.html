<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>My Account — Ayaan PWD</title>
<meta name="description" content="Manage your Ayaan PWD account — cart, wishlist, orders and profile."/>
<meta name="robots" content="noindex"/>
<link rel="stylesheet" href="assets/style.css"/>
<style>
body{background:var(--bg)}
.acc-shell{max-width:1100px;margin:0 auto;padding:40px 32px;display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:start}
.acc-sidebar{background:var(--white);border:1px solid var(--border);border-radius:12px;overflow:hidden;position:sticky;top:76px}
.acc-user-hd{background:var(--blue);padding:22px 18px;text-align:center}
.acc-avatar{width:58px;height:58px;border-radius:50%;background:var(--red);color:#fff;font-family:var(--ff-head);font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.acc-uname{font-family:var(--ff-head);font-weight:700;color:#fff;font-size:15px}
.acc-uemail{font-size:11px;color:rgba(255,255,255,.5);margin-top:2px}
.acc-nav{padding:10px}
.acc-link{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:7px;color:var(--ink-2);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;border:none;background:none;width:100%;text-align:left;font-family:var(--ff-head);margin-bottom:1px}
.acc-link:hover{background:var(--bg);color:var(--blue)}
.acc-link.active{background:var(--blue-lt);color:var(--blue)}
.acc-link-ico{margin-right:8px}
.acc-link-badge{background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:10px}

.acc-tab{display:none}.acc-tab.active{display:block}
.acc-tab-title{font-family:var(--ff-head);font-size:22px;font-weight:800;margin-bottom:20px;color:var(--ink)}

/* CART */
.cart-row{background:var(--white);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;gap:14px;padding:13px;margin-bottom:10px}
.cart-thumb{width:68px;height:68px;border-radius:8px;flex-shrink:0;overflow:hidden;position:relative}
.cart-thumb img,.cart-thumb-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cart-info{flex:1;min-width:0}
.cart-name{font-family:var(--ff-head);font-weight:700;font-size:14px;margin-bottom:2px}
.cart-meta{font-size:12px;color:var(--ink-3)}
.qty-ctrl{display:flex;align-items:center;gap:7px}
.qty-btn{width:28px;height:28px;border:1.5px solid var(--border);border-radius:5px;background:var(--bg);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s;color:var(--ink);line-height:1}
.qty-btn:hover{border-color:var(--blue);color:var(--blue)}
.qty-num{font-weight:700;min-width:18px;text-align:center;font-size:14px}
.cart-price{font-weight:800;font-size:15px;min-width:78px;text-align:right;font-family:var(--ff-head)}
.cart-del{color:var(--ink-3);padding:5px;border-radius:5px;cursor:pointer;font-size:18px;border:none;background:none;transition:all .2s;line-height:1}
.cart-del:hover{color:var(--red);background:var(--red-lt)}

/* COUPON */
.coupon-row{display:flex;gap:10px;align-items:center;background:var(--bg);border:2px dashed var(--border);border-radius:8px;padding:12px 14px;margin-bottom:12px;transition:border-color .2s}
.coupon-row:focus-within{border-color:var(--blue)}
.coupon-row input{flex:1;border:none;outline:none;font-size:14px;background:none;font-family:var(--ff-body);text-transform:uppercase;letter-spacing:.06em}
.coupon-applied{background:var(--green-lt);border:2px solid var(--green);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--green);font-weight:700;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}

/* ORDER SUMMARY */
.cart-summary-box{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:22px;margin-top:14px}
.sum-row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:10px;color:var(--ink-2)}
.sum-row.total{font-weight:800;font-size:17px;padding-top:12px;border-top:2px solid var(--red);margin-top:8px;color:var(--ink);font-family:var(--ff-head)}
.sum-row.discount{color:var(--green);font-weight:600}
.wa-preview-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:13px;font-size:12px;color:var(--ink-2);line-height:1.75;margin-top:12px;white-space:pre-wrap;font-family:monospace}
.wa-preview-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin-bottom:6px;display:block}

/* ORDER TIMELINE */
.order-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:14px}
.order-hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.order-id{font-family:var(--ff-head);font-weight:800;color:var(--blue);font-size:13px}
.order-items-text{font-size:13px;color:var(--ink-2);line-height:1.8;margin-bottom:14px}
.order-note{background:var(--blue-lt);border-radius:6px;padding:8px 12px;font-size:12px;color:var(--blue);margin-bottom:14px}

/* TIMELINE */
.timeline{display:flex;align-items:center;gap:0;margin-bottom:14px}
.tl-step{display:flex;flex-direction:column;align-items:center;flex:1;position:relative}
.tl-step:not(:last-child)::after{content:'';position:absolute;top:16px;left:50%;width:100%;height:2px;background:var(--border);z-index:0}
.tl-step.done:not(:last-child)::after{background:var(--green)}
.tl-dot{width:32px;height:32px;border-radius:50%;border:2px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:14px;z-index:1;transition:all .3s}
.tl-step.done .tl-dot{background:var(--green);border-color:var(--green);color:#fff}
.tl-step.active .tl-dot{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 0 4px rgba(0,48,135,.15)}
.tl-lbl{font-size:10px;font-weight:700;color:var(--ink-3);margin-top:6px;text-transform:uppercase;letter-spacing:.06em;text-align:center}
.tl-step.done .tl-lbl,.tl-step.active .tl-lbl{color:var(--ink)}

.order-foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding-top:12px;border-top:1px solid var(--border)}
.order-total-val{font-family:var(--ff-head);font-weight:800;font-size:16px}
.reorder-btn{display:flex;align-items:center;gap:6px;background:var(--blue-lt);color:var(--blue);border:none;border-radius:6px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;font-family:var(--ff-head)}
.reorder-btn:hover{background:var(--blue);color:#fff}

/* WISHLIST */
.wish-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:14px}
.wish-card{background:var(--white);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:all .25s;position:relative}
.wish-card:hover{box-shadow:0 10px 30px rgba(0,48,135,.12);transform:translateY(-3px)}
.wish-img{height:140px;position:relative;overflow:hidden}
.wish-remove{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;border:none;z-index:2;transition:all .2s}
.wish-remove:hover{background:var(--red);color:#fff}
.wish-body{padding:11px 12px}
.wish-name{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.wish-price{font-size:13px}

/* PROFILE */
.profile-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:26px;max-width:480px}

@media(max-width:860px){.acc-shell{grid-template-columns:1fr;padding:24px 16px}.acc-sidebar{position:static}}
</style>
</head>
<body>
<div id="nav-ph"></div>
<div class="page-hero" style="padding:34px 32px">
  <div class="page-hero-inner"><div class="page-hero-label">My Account</div><h1 id="acc-ph-name">Welcome</h1></div>
</div>

<div class="acc-shell">
  <aside class="acc-sidebar">
    <div class="acc-user-hd">
      <div class="acc-avatar" id="acc-av">?</div>
      <div class="acc-uname" id="acc-uname">—</div>
      <div class="acc-uemail" id="acc-uemail">—</div>
    </div>
    <div class="acc-nav">
      <button class="acc-link active" onclick="sw('cart',this)"><span class="acc-link-ico">🛒</span>Cart <span class="acc-link-badge" id="cart-ct-badge"></span></button>
      <button class="acc-link" onclick="sw('wishlist',this)"><span class="acc-link-ico">❤️</span>Wishlist <span class="acc-link-badge" id="wish-ct-badge" style="background:var(--red)"></span></button>
      <button class="acc-link" onclick="sw('orders',this)"><span class="acc-link-ico">📋</span>My Orders</button>
      <button class="acc-link" onclick="sw('profile',this)"><span class="acc-link-ico">👤</span>Profile</button>
      <hr class="divider"/>
      <button class="acc-link" onclick="doLogout()" style="color:var(--red)"><span class="acc-link-ico">🚪</span>Logout</button>
    </div>
  </aside>

  <div>
    <!-- CART TAB -->
    <div class="acc-tab active" id="tab-cart">
      <div class="acc-tab-title">Saved Cart</div>
      <div id="cart-content"></div>
    </div>

    <!-- WISHLIST TAB -->
    <div class="acc-tab" id="tab-wishlist">
      <div class="acc-tab-title">My Wishlist</div>
      <div id="wishlist-content"></div>
    </div>

    <!-- ORDERS TAB -->
    <div class="acc-tab" id="tab-orders">
      <div class="acc-tab-title">My Orders & Inquiries</div>
      <div id="orders-content"></div>
    </div>

    <!-- PROFILE TAB -->
    <div class="acc-tab" id="tab-profile">
      <div class="acc-tab-title">My Profile</div>
      <div class="profile-card">
        <div class="form-group"><label class="form-label">Full Name</label><input type="text" id="pr-name" class="form-input"/></div>
        <div class="form-group"><label class="form-label">Email</label><input type="email" id="pr-email" class="form-input" disabled style="background:var(--bg);color:var(--ink-3)"/></div>
        <div class="form-group"><label class="form-label">Phone (for orders)</label><input type="tel" id="pr-phone" class="form-input" placeholder="+92 3xx xxxxxxx"/></div>
        <div class="form-group"><label class="form-label">Delivery Address</label><textarea id="pr-addr" class="form-input" rows="2" placeholder="House no, street, area..."></textarea></div>
        <hr class="divider"/>
        <div style="font-family:var(--ff-head);font-size:14px;font-weight:700;margin-bottom:14px">Change Password</div>
        <div class="form-group"><label class="form-label">Current Password</label><div class="pw-wrap"><input type="password" id="pr-cur-pw" class="form-input" placeholder="Current password"/><button class="pw-eye" onclick="togglePw('pr-cur-pw',this)">👁</button></div></div>
        <div class="form-group"><label class="form-label">New Password</label><div class="pw-wrap"><input type="password" id="pr-new-pw" class="form-input" placeholder="New password (min 6 chars)"/><button class="pw-eye" onclick="togglePw('pr-new-pw',this)">👁</button></div><div class="form-error" id="pr-pw-err"></div></div>
        <button class="btn btn-blue" onclick="saveProfile()">💾 Save Profile</button>
      </div>
    </div>
  </div>
</div>

<a id="wa-float-btn" href="#" target="_blank" class="wa-float">
  <div class="wa-float-label">Chat with us!</div>
  <svg viewBox="0 0 24 24" fill="white" width="28" height="28"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
</a>

<div id="footer-ph"></div>
<script src="assets/app.js"></script>
<script>
document.getElementById('nav-ph').innerHTML = buildNav('');
document.getElementById('footer-ph').innerHTML = buildFooter();

if(!Session.isLoggedIn()||!Session.isCustomer()){ showToast('Please login.','error'); setTimeout(()=>location.href='login.html',900); }

const user = Session.getUser();
if(user){
  document.getElementById('acc-av').textContent = user.name.charAt(0).toUpperCase();
  document.getElementById('acc-uname').textContent = user.name;
  document.getElementById('acc-uemail').textContent = user.email||'';
  document.getElementById('acc-ph-name').textContent = 'Welcome, '+user.name.split(' ')[0];
  document.getElementById('pr-name').value = user.name||'';
  document.getElementById('pr-email').value = user.email||'';
  document.getElementById('pr-phone').value = user.phone||'';
  document.getElementById('pr-addr').value = user.address||'';
}

function updateBadges(){
  const cc=Cart.count(), wc=Wishlist.count();
  const cb=document.getElementById('cart-ct-badge'); if(cb)cb.textContent=cc||''; if(cb)cb.style.display=cc?'':'none';
  const wb=document.getElementById('wish-ct-badge'); if(wb)wb.textContent=wc||''; if(wb)wb.style.display=wc?'':'none';
}
updateBadges();

function sw(name, btn){
  document.querySelectorAll('.acc-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.acc-link').forEach(l=>l.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  if(btn) btn.classList.add('active');
  if(name==='cart') renderCart();
  if(name==='wishlist') renderWishlist();
  if(name==='orders') renderOrders();
}

// ── COUPON STATE ──
let appliedCoupon=null;

function applyCoupon(){
  const code=document.getElementById('coupon-inp')?.value?.trim();
  if(!code){showToast('Enter a coupon code.','error');return;}
  const c=Coupons.getByCode(code);
  if(!c){showToast('Invalid or expired coupon code.','error');return;}
  if(c.maxUses>0&&(c.uses||0)>=c.maxUses){showToast('This coupon has reached its limit.','error');return;}
  if(c.expiry&&new Date(c.expiry)<new Date()){showToast('This coupon has expired.','error');return;}
  appliedCoupon=c;
  showToast('Coupon applied! '+c.discount+'% off ✓','success');
  renderCart();
}
function removeCoupon(){ appliedCoupon=null; renderCart(); showToast('Coupon removed.'); }

// ── CART ──
function renderCart(){
  const items=Cart.get(); const el=document.getElementById('cart-content');
  if(!items.length){
    el.innerHTML=`<div style="text-align:center;padding:56px 20px"><div style="font-size:52px;margin-bottom:14px">🛒</div><h3 style="font-family:var(--ff-head);font-size:20px;margin-bottom:8px">Your cart is empty</h3><p style="color:var(--ink-3);margin-bottom:20px">Browse and add items you love.</p><a href="catalog.html" class="btn btn-red btn-lg">Browse Shop</a></div>`;
    return;
  }
  let subtotal=0;
  const rows=items.map(it=>{
    const p=Products.getById(it.productId); if(!p)return'';
    const lt=p.price*it.qty; subtotal+=lt;
    return `<div class="cart-row">
      <div class="cart-thumb" style="background:${getCatGrad(p.cat)}">${p.img?`<img src="${p.img}"/>`:''}
      </div>
      <div class="cart-info"><div class="cart-name">${p.name}</div><div class="cart-meta">${getCatLabel(p.cat)} · ${p.fabric} · <strong>Size: ${it.size}</strong></div></div>
      <div class="qty-ctrl">
        <button class="qty-btn" onclick="chQty(${p.id},'${it.size}',-1)">−</button>
        <span class="qty-num">${it.qty}</span>
        <button class="qty-btn" onclick="chQty(${p.id},'${it.size}',1)">+</button>
      </div>
      <div class="cart-price">${fmtPrice(lt)}</div>
      <button class="cart-del" onclick="rmItem(${p.id},'${it.size}')">✕</button>
    </div>`;
  }).join('');

  const disc = appliedCoupon ? Math.round(subtotal*(appliedCoupon.discount/100)) : 0;
  const total = subtotal - disc;

  // Build WA message
  const s=SiteSettings.get();
  let waMsg='Assalam o Alaikum! I would like to order:\n\n';
  items.forEach(it=>{ const p=Products.getById(it.productId); if(p)waMsg+=`• ${p.name} – Size: ${it.size} × ${it.qty} = ${fmtPrice(p.price*it.qty)}\n`; });
  if(appliedCoupon) waMsg+=`\nCoupon: ${appliedCoupon.code} (-${appliedCoupon.discount}%)\nDiscount: -${fmtPrice(disc)}`;
  waMsg+=`\n\nTotal: ${fmtPrice(total)}\n\nPlease confirm. JazakAllah!`;

  // ★ Validate stock before letting user proceed ★
  const stockIssues = Cart.validate();
  const stockWarning = stockIssues.length ? `<div style="background:#fff3cd;border:1.5px solid #ffc107;border-radius:8px;padding:12px 14px;margin-bottom:12px;font-size:13px;color:#856404"><strong>⚠️ Stock issue${stockIssues.length>1?'s':''}:</strong><br/>${stockIssues.map(i=>`• ${i}`).join('<br/>')}</div>` : '';

  el.innerHTML=rows+`
  <div style="display:flex;justify-content:flex-end;margin-bottom:6px"><button onclick="if(confirm('Clear cart?')){Cart.clear();renderCart();document.getElementById('nav-ph').innerHTML=buildNav('')}" style="font-size:12px;color:var(--red);font-weight:700;cursor:pointer;border:none;background:none">✕ Clear Cart</button></div>
  ${stockWarning}

  ${appliedCoupon
    ? `<div class="coupon-applied">✓ ${appliedCoupon.code} — ${appliedCoupon.discount}% off applied<button onclick="removeCoupon()" style="border:none;background:none;cursor:pointer;color:var(--green);font-size:16px;line-height:1">×</button></div>`
    : `<div class="coupon-row"><span style="font-size:16px">🏷</span><input type="text" id="coupon-inp" placeholder="Enter coupon code..." onkeydown="if(event.key==='Enter')applyCoupon()"/><button class="btn btn-blue btn-sm" onclick="applyCoupon()">Apply</button></div>`
  }

  <div class="cart-summary-box">
    <div class="sum-row"><span>Subtotal</span><span>${fmtPrice(subtotal)}</span></div>
    ${disc>0?`<div class="sum-row discount"><span>Discount (${appliedCoupon.code})</span><span>− ${fmtPrice(disc)}</span></div>`:''}
    <div class="sum-row"><span>Delivery</span><span style="color:var(--green);font-weight:600">Confirm on WhatsApp</span></div>
    <div class="sum-row total"><span>Total</span><span>${fmtPrice(total)}</span></div>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:16px">
      <a href="${stockIssues.length ? '#' : waLink(waMsg)}" ${stockIssues.length ? 'onclick="showToast(\'Please fix stock issues above before ordering.\',\'error\');return false"' : 'target="_blank"'} class="btn btn-wa btn-full btn-lg" style="${stockIssues.length ? 'opacity:.5;cursor:not-allowed' : ''}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        Order via WhatsApp
      </a>
      <a href="${callLink()}" class="btn btn-outline-blue btn-full">📞 Call to Order</a>
    </div>
    <span class="wa-preview-label" style="margin-top:14px">📋 WhatsApp Message Preview</span>
    <div class="wa-preview-box">${waMsg}</div>
  </div>`;
  updateBadges();
}

function chQty(pid,size,d){
  const c=Cart.get(); const it=c.find(i=>i.productId==pid&&i.size===size);
  if(it){it.qty=Math.max(0,it.qty+d); if(it.qty===0)Cart.remove(pid,size); else Cart.save(c);}
  document.getElementById('nav-ph').innerHTML=buildNav(''); renderCart();
}
function rmItem(pid,size){ Cart.remove(pid,size); document.getElementById('nav-ph').innerHTML=buildNav(''); renderCart(); showToast('Removed.'); }

// ── WISHLIST ──
function renderWishlist(){
  const ids=Wishlist.get(); const el=document.getElementById('wishlist-content');
  if(!ids.length){ el.innerHTML=`<div style="text-align:center;padding:56px 20px"><div style="font-size:52px;margin-bottom:14px">🤍</div><h3 style="font-family:var(--ff-head);font-size:20px;margin-bottom:8px">Your wishlist is empty</h3><p style="color:var(--ink-3);margin-bottom:20px">Tap the heart on any product to save it here.</p><a href="catalog.html" class="btn btn-red btn-lg">Browse Shop</a></div>`; return; }
  const prods=ids.map(id=>Products.getById(id)).filter(Boolean);
  el.innerHTML=`<div class="wish-grid">`+prods.map(p=>`
    <div class="wish-card">
      <div class="wish-img" style="background:${getCatGrad(p.cat)}" onclick="location.href='catalog.html?pid=${p.id}'">${p.img?`<img src="${p.img}" style="width:100%;height:100%;object-fit:cover"/>`:''}
        <button class="wish-remove" onclick="event.stopPropagation();Wishlist.toggle(${p.id});renderWishlist();updateBadges();showToast('Removed.')">✕</button>
      </div>
      <div class="wish-body">
        <div style="font-size:10px;font-weight:700;color:var(--blue);letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px">${getCatLabel(p.cat)}</div>
        <div class="wish-name">${p.name}</div>
        <div class="wish-price">${priceBadge(p)}</div>
        <div style="display:flex;gap:7px;margin-top:10px">
          <button class="btn btn-blue btn-sm" style="flex:1" onclick="addFromWish(${p.id})">Add to Cart</button>
          <a href="${waLink('Interested in: '+p.name)}" target="_blank" class="btn btn-wa btn-sm">Chat</a>
        </div>
      </div>
    </div>`).join('')+'</div>';
}
function addFromWish(id){
  const p=Products.getById(id); if(!p)return;
  const sizes=Array.isArray(p.sizes)?p.sizes:(p.sizes||'').split(',').map(s=>s.trim()).filter(Boolean);
  const size=sizes[0]||'';
  Cart.add(id,size,1);
  showToast(p.name+' added to cart!','success');
  document.getElementById('nav-ph').innerHTML=buildNav('');
  updateBadges();
}

// ── ORDERS ──
function statusStep(status){ return status==='delivered'?2:status==='confirmed'?1:0; }
function renderOrders(){
  const ords=Orders.getByUser(user?.id||0).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  const el=document.getElementById('orders-content');
  if(!ords.length){ el.innerHTML=`<div style="text-align:center;padding:56px 20px"><div style="font-size:48px;margin-bottom:14px">📋</div><p style="color:var(--ink-3)">No orders yet. Your confirmed WhatsApp orders will appear here.</p></div>`; return; }
  el.innerHTML=ords.map(o=>{
    const step=statusStep(o.status);
    const steps=[{label:'Order Placed',icon:'📦'},{label:'Confirmed',icon:'✅'},{label:'Delivered',icon:'🎉'}];
    const tl=steps.map((s,i)=>`<div class="tl-step ${i<step?'done':i===step?'active':''}">
      <div class="tl-dot">${i<=step?s.icon:'○'}</div>
      <div class="tl-lbl">${s.label}</div>
    </div>`).join('');
    const items=(o.items||[]).filter(Boolean);
    const canReorder=items.length>0;
    return `<div class="order-card">
      <div class="order-hd">
        <div><div class="order-id">${o.id}</div><div style="font-size:12px;color:var(--ink-3);margin-top:2px">${fmtDate(o.createdAt)} · ${o.payMethod||'COD'}</div></div>
        <span class="status status-${o.status}">${o.status.charAt(0).toUpperCase()+o.status.slice(1)}</span>
      </div>
      <div class="timeline">${tl}</div>
      <div class="order-items-text">${o.itemsText||items.map(it=>{const p=Products.getById(it.productId);return p?`${p.name} (${it.size}) × ${it.qty}`:''}).filter(Boolean).join(' · ')}</div>
      ${o.note?`<div class="order-note">📝 Staff note: ${o.note}</div>`:''}
      <div class="order-foot">
        <div class="order-total-val">${fmtPrice(o.total||0)}</div>
        <div style="display:flex;gap:8px">
          ${canReorder?`<button class="reorder-btn" onclick="reorder(${JSON.stringify(items).replace(/"/g,'&quot;')})">🔁 Reorder</button>`:''}
          <a href="${waLink('Assalam o Alaikum! Regarding order '+o.id+': ')}" target="_blank" class="btn btn-sm btn-wa">WhatsApp</a>
        </div>
      </div>
    </div>`;
  }).join('');
}

function reorder(items){
  let added=0;
  items.forEach(it=>{ if(it.productId&&it.size){Cart.add(it.productId,it.size,it.qty||1);added++;} });
  if(added){ showToast('Items added to cart!','success'); document.getElementById('nav-ph').innerHTML=buildNav(''); setTimeout(()=>sw('cart',document.querySelector('.acc-link')),500); }
  else showToast('Could not reorder — items may no longer be available.','error');
}

// ── PROFILE ──
async function saveProfile(){
  if(!user) return;
  document.getElementById('pr-pw-err').textContent='';
  const curPw=document.getElementById('pr-cur-pw').value;
  const newPw=document.getElementById('pr-new-pw').value;
  if(newPw){
    const curHash=await hashPassword(curPw);
    const storedHash=user.passwordHash||(user.password?await hashPassword(user.password):null);
    const legacyMatch=!user.passwordHash&&user.password===curPw;
    if(!legacyMatch&&curHash!==storedHash){ document.getElementById('pr-pw-err').textContent='Current password incorrect.'; return; }
    if(newPw.length<6){ document.getElementById('pr-pw-err').textContent='Min 6 characters.'; return; }
  }
  const newHash=newPw?await hashPassword(newPw):undefined;
  const updated={...user,name:document.getElementById('pr-name').value.trim(),phone:document.getElementById('pr-phone').value.trim(),address:document.getElementById('pr-addr').value.trim()};
  if(newHash){ updated.passwordHash=newHash; delete updated.password; }
  Users.update(user.id,updated);
  Session.setUser(updated,ROLES.CUSTOMER);
  document.getElementById('acc-uname').textContent=updated.name;
  document.getElementById('acc-av').textContent=updated.name.charAt(0).toUpperCase();
  document.getElementById('pr-cur-pw').value='';
  document.getElementById('pr-new-pw').value='';
  showToast('Profile saved!','success');
}
